[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "oct-llf"
version = "0.1.0"
description = "Validated OCT log-probability scoring and calibration"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<2.2",
  "scipy>=1.11,<1.15",
  "pyarrow>=14,<19",
  "pyyaml>=6",
]

[project.optional-dependencies]
inference = [
  "transformers==5.12.1",
  "peft==0.19.1",
  "huggingface-hub>=0.28",
]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "build>=1.2"]

[project.scripts]
oct-llf = "oct_llf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oct_llf"]

[tool.hatch.build.targets.sdist]
include = [
  "src/oct_llf",
  "scripts",
  "results",
  "tests",
  "docs",
  "data/README.md",
  "data/bundle_manifest.json",
  "data/reference",
  "README.md",
  "LICENSE",
  "NOTICE-DATA",
  "CITATION.cff",
  "pyproject.toml",
]
exclude = ["data/*.parquet", "data/**/*.parquet"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "scipy.*"]
ignore_missing_imports = true
