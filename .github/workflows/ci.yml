name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src/oct_llf
      - run: pytest -q
      - run: python -m build
      - name: Ensure data files are not distribution payloads
        run: |
          python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          for path in Path("dist").iterdir():
              names = zipfile.ZipFile(path).namelist() if path.suffix == ".whl" else tarfile.open(path).getnames()
              assert not any(name.endswith(".parquet") for name in names), path
          PY
      - name: Validate full bundled data
        if: matrix.python-version == '3.12'
        run: oct-llf validate-data data --manifest data/bundle_manifest.json --scan-repository .
